# Isolated registry compatibility fixture. Exact tags are supplied by the
# matrix runner; every resolved image digest is recorded in evidence.json.
services:
  kafka:
    image: apache/kafka:3.7.1
    ports: ["${REGISTRY_KAFKA_PORT:-29492}:9092"]
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9094,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9094,EXTERNAL://localhost:${REGISTRY_KAFKA_PORT:-29492}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  confluent-source:
    image: confluentinc/cp-schema-registry:${REGISTRY_CONFLUENT_SOURCE_VERSION:-8.3.1}
    depends_on: [kafka]
    ports: ["${REGISTRY_CF_SOURCE_PORT:-29481}:8081"]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: confluent-source
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9094
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: _schemas_source
      SCHEMA_REGISTRY_SCHEMA_REGISTRY_GROUP_ID: registry-source
      SCHEMA_REGISTRY_MODE_MUTABILITY: "true"
  confluent-target:
    image: confluentinc/cp-schema-registry:${REGISTRY_CONFLUENT_TARGET_VERSION:-8.3.1}
    depends_on: [kafka]
    ports: ["${REGISTRY_CF_TARGET_PORT:-29482}:8081"]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: confluent-target
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9094
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: _schemas_target
      SCHEMA_REGISTRY_SCHEMA_REGISTRY_GROUP_ID: registry-target
      SCHEMA_REGISTRY_MODE_MUTABILITY: "true"
  apicurio-source:
    image: ${REGISTRY_APICURIO_SOURCE_IMAGE:-quay.io/apicurio/apicurio-registry:3.3.3}
    ports: ["${REGISTRY_AP_SOURCE_PORT:-29483}:8080"]
    environment:
      # Test source only: deleting a fixture leaves gaps in allocated IDs.
      APICURIO_REST_DELETION_ARTIFACT_ENABLED: "true"
  apicurio-target:
    image: ${REGISTRY_APICURIO_TARGET_IMAGE:-quay.io/apicurio/apicurio-registry:3.3.3}
    ports: ["${REGISTRY_AP_TARGET_PORT:-29484}:8080"]
